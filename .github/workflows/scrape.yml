name: Update Swim Calendar (Mothballed)

# PROJECT MOTHBALLED: Scheduled background execution has been deactivated.
# To run manually in the future, trigger via workflow_dispatch from the GitHub UI.
on:
  workflow_dispatch:

permissions:
  contents: write # Needed to commit and push meets.json back to the repo

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --prefer-offline

      - name: Run Scraper
        run: npm run scrape:local

      - name: Commit and Push Data Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain meets.json)" ]; then
            echo "Changes detected in meets.json. Committing..."
            git add meets.json
            git commit -m "chore: auto-update meets calendar data [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes in meets.json. Skipping commit."
          fi
